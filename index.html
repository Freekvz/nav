<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brommer Nav">
<meta name="theme-color" content="#0f1a14">
<title>Brommer Nav</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rye&family=Silkscreen:wght@400;700&family=Oswald:wght@500;700&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.6.0/dist/leaflet-rotate.js"></script>
<style>
  :root{
    --green:#0d7a43; --green-dark:#0a5c33; --bg:#0f1a14; --card:#16231b; --card2:#1d2e24;
    --text:#ffffff; --muted:#a9bdb0; --warn:#e8a317; --danger:#d93636; --blue:#1a73e8;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
  button{font-family:inherit}
  #map{position:absolute;inset:0;z-index:1;background:#dfe6e1}
  .hidden{display:none!important}

  /* ---------- Home: search ---------- */
  #home{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(var(--st) + 10px) 10px 0;pointer-events:none}
  #home > *{pointer-events:auto}
  #searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  #menuBtn{width:44px;height:44px;border:0;border-radius:12px;background:#eef3f0;font-size:22px;color:#0f1a14}
  #q{flex:1;min-width:0;border:0;outline:0;font-size:18px;padding:10px 4px;color:#0f1a14;background:transparent}
  #q::placeholder{color:#7a8a80}
  #clearQ{width:40px;height:40px;border:0;border-radius:12px;background:transparent;font-size:18px;color:#56635b}
  #searchTarget{display:none;margin:8px 4px 0;font-size:14px;font-weight:700;color:#0f1a14;background:#fff;border-radius:999px;padding:6px 12px;width:max-content;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #sugg{margin-top:8px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.25);max-height:55vh;overflow-y:auto}
  .sg{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid #e8eee9;color:#0f1a14;cursor:pointer}
  .sg:last-child{border-bottom:0}
  .sg:active{background:#eef3f0}
  .sg .ic{font-size:20px;width:26px;text-align:center;flex:0 0 26px}
  .sg .t{font-size:16px;font-weight:700}
  .sg .s{font-size:13px;color:#5f6e65;margin-top:2px}
  .sg.info{color:#5f6e65;font-size:15px;cursor:default}

  #locBtn{position:absolute;right:12px;bottom:calc(var(--sb) + 24px);z-index:10;width:50px;height:50px;border-radius:50%;border:0;background:#fff;
    font-size:22px;color:var(--blue);box-shadow:0 3px 10px rgba(0,0,0,.3)}

  /* ---------- Plan panel ---------- */
  #plan{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:0 10px calc(var(--sb) + 10px)}
  #planCard{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 -4px 20px rgba(0,0,0,.35)}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .plbl{width:42px;color:var(--muted);font-size:14px;font-weight:600}
  .pval{flex:1;min-width:0;background:var(--card2);border:0;color:#fff;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{margin-top:-2px}
  .tbtn{flex:1;border:0;border-radius:12px;padding:9px 10px;background:#24382c;color:#fff;font-size:15px;font-weight:700}
  .tbtn:disabled{opacity:.4}
  .vdel{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:12px;background:#24382c;color:#fff;font-size:16px}
  #planCard{max-height:70vh;overflow-y:auto}
  #planInfo{margin:6px 2px 12px;font-size:15px;color:var(--muted);line-height:1.4}
  #planInfo b{color:#fff;font-size:22px}
  #planInfo .err{color:#ffb4b4}
  .actions{display:flex;gap:8px}
  .actions button{border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:800}
  #startBtn{flex:1;background:var(--green);color:#fff}
  #startBtn:disabled{opacity:.45}
  #demoBtn{background:#24382c;color:#fff;font-size:15px}
  #demoBtn:disabled{opacity:.45}
  #cancelPlan{background:#24382c;color:#fff;width:54px}

  /* ---------- Drawer ---------- */
  #shade{position:absolute;inset:0;z-index:39;background:rgba(0,0,0,.45)}
  #drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:40;background:var(--bg);
    padding:calc(var(--st) + 18px) 0 calc(var(--sb) + 18px);overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease}
  #drawer.open{transform:none}
  #drawer h2{margin:0 18px 4px;font-size:24px}
  #drawer .sub{margin:0 18px 16px;color:var(--muted);font-size:14px}
  .di{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:14px 18px;font-size:16px;font-weight:600}
  .di:active{background:#1d2e24}
  .di .ic{font-size:22px;width:28px;text-align:center}
  .di .s{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
  .dh{margin:14px 18px 4px;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

  /* ---------- Modal ---------- */
  #modal{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:10px}
  #modalBox{background:var(--card);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;margin-bottom:var(--sb)}
  .setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2a3d31}
  .setrow .st{font-size:16px;font-weight:700;color:#fff}
  .setrow .ss{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
  .sw{flex:0 0 52px;width:52px!important;height:32px;border-radius:999px!important;border:0;background:#3a4a40!important;position:relative;margin:0!important;padding:0!important}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on{background:var(--green)!important}
  .sw.on::after{left:23px}
  #modalBox .ghost{background:#24382c}
  #modalBox h3{margin:0 0 10px;font-size:20px}
  #modalBox p,#modalBox li{color:#d9e5dd;font-size:15px;line-height:1.5}
  #modalBox button{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;background:var(--green);color:#fff}

  /* ---------- Navigation ---------- */
  #top{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(var(--st) + 8px) 10px 0}
  #card{background:var(--green);border-radius:18px;display:flex;align-items:center;gap:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #card.off{background:var(--danger)}
  #card.done{background:var(--blue)}
  #card.busy{background:#5b6b62}
  #icon{width:68px;height:68px;flex:0 0 68px}
  #icon svg{width:100%;height:100%}
  #dist{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.5px}
  #verb{font-size:20px;font-weight:600;margin-top:4px;opacity:.95}
  #street{font-size:24px;font-weight:800;margin-top:2px;line-height:1.1;word-break:break-word}
  #then{display:none;margin:0 8px;background:var(--green-dark);border-radius:0 0 14px 14px;
    padding:8px 14px;font-size:16px;font-weight:600;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 16px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  #then svg{width:22px;height:22px;flex:0 0 22px}
  #road{margin:8px auto 0;width:max-content;max-width:90%;background:rgba(15,26,20,.85);color:#fff;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;display:none}
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 10px calc(var(--sb) + 10px)}
  #bar{background:var(--card);border-radius:20px;display:flex;align-items:center;gap:12px;padding:12px 14px;box-shadow:0 -4px 20px rgba(0,0,0,.35)}
  #speedo{width:86px;height:86px;flex:0 0 86px;border-radius:50%;border:5px solid #2e4a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b130e;transition:border-color .3s}
  #speedo.fast{border-color:var(--danger)}
  #speedo.near{border-color:var(--warn)}
  #spd{font-size:36px;font-weight:800;line-height:1}
  #spdu{font-size:12px;color:var(--muted);font-weight:600}
  #info{flex:1;min-width:0}
  #eta{font-size:24px;font-weight:800}
  #rem{font-size:15px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btns{display:flex;flex-direction:column;gap:8px}
  .btn{background:#24382c;border:0;color:#fff;border-radius:12px;width:46px;height:40px;font-size:20px;display:flex;align-items:center;justify-content:center}
  #limit{position:absolute;left:14px;z-index:10;display:none;flex-direction:column;align-items:center}
  #limitSign{width:68px;height:68px;border-radius:50%;background:#fff;border:8px solid #d93636;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:900;color:#111;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  #limitCap{margin-top:4px;background:rgba(15,26,20,.85);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap}
  #viewBtn{position:absolute;right:14px;z-index:11;display:none;align-items:center;gap:6px;background:#fff;color:#0f1a14;border:0;border-radius:999px;padding:9px 14px 9px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  #viewBtn svg{width:24px;height:24px}
  #viewToast{position:absolute;left:50%;transform:translateX(-50%);z-index:12;display:none;background:rgba(15,26,20,.92);color:#fff;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;white-space:nowrap}
  #recenter{position:absolute;right:150px;z-index:10;display:none;background:#fff;color:var(--green);border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .leaflet-control-attribution{font-size:9px!important}
  /* ---------- Instellingenscherm ---------- */
  #settingsPage{position:absolute;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
  .sp-head{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 12px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sp-head h2{margin:0;font-size:22px}
  #spBack{border:0;background:var(--card2);color:#fff;font-size:16px;font-weight:700;border-radius:12px;padding:10px 14px}
  .sp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--sb) + 30px)}
  .sp-sec{margin:22px 0 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .thcard{display:flex;align-items:center;gap:14px;width:100%;border:2px solid transparent;background:var(--card);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px;text-align:left}
  .thcard.sel{border-color:#fff}
  .thcard .prev{width:86px;height:64px;flex:0 0 86px;border-radius:10px;position:relative;overflow:hidden}
  .thcard .prev i{position:absolute;left:10px;right:10px;top:28px;height:7px;border-radius:4px}
  .thcard .prev b{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:6px}
  .thcard .nm{font-size:17px;font-weight:800}
  .thcard .ds{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
  .thcard .ck{margin-left:auto;font-size:22px;opacity:0}
  .thcard.sel .ck{opacity:1}
  .sp-card{background:var(--card);border-radius:16px;padding:4px 14px}
  .sp-card .setrow:last-child{border-bottom:0}
  .sp-btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;margin-top:10px;background:var(--card2);color:#fff;text-align:center}
  .sp-btn.primary{background:var(--green)}
  .sp-note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:10px}
  /* ---------- Thema's ---------- */
  #themeFx{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
  .thgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
  #modalBox .thb{margin:0;padding:12px 10px;border-radius:14px;background:var(--card2);color:#fff;font-size:15px;font-weight:800;text-align:left;border:2px solid transparent}
  #modalBox .thb.sel{border-color:#fff}
  #modalBox .thb small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .sectt{margin:16px 0 4px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  /* Horror */
  body.th-horror{--green:#7a1010;--green-dark:#3a0b0b;--card:#121212;--card2:#1f1a1a;--bg:#0b0b0b;--muted:#a39a90;--me:#b31b1b}
  body.th-horror #map{background:#0b0f0c}
  body.th-horror .leaflet-tile-pane{filter:grayscale(.85) sepia(.35) hue-rotate(55deg) brightness(.42) contrast(1.35)}
  body.th-horror #themeFx{display:block;background:radial-gradient(ellipse at 50% 58%,rgba(0,0,0,0) 32%,rgba(0,0,0,.78) 100%);animation:thflick 9s infinite}
  @keyframes thflick{0%,46%,50%,100%{opacity:1}47%{opacity:.7}48%{opacity:1}49%{opacity:.82}75%{opacity:.92}}
  body.th-horror #card{background:#160c0c;border:1px solid #5a1414;box-shadow:0 0 26px rgba(160,20,20,.35)}
  body.th-horror #card.off{background:#5a0d0d}
  body.th-horror #dist,body.th-horror #drawer h2,body.th-horror #modalBox h3{font-family:'Creepster',cursive;letter-spacing:1.5px;font-weight:400;color:#e9dccb}
  body.th-horror #speedo{border-color:#4a1212;background:#060606}
  body.th-horror #limitSign{border-color:#7a1010;background:#d8d0c4}
  /* Wilde Westen */
  body.th-western{--green:#8a4b1c;--green-dark:#5e3312;--card:#3b2412;--card2:#4d3019;--bg:#2a180b;--muted:#dcc39c;--me:#7a2e12}
  body.th-western #map{background:#e7d3a8}
  body.th-western .leaflet-tile-pane{filter:sepia(.9) saturate(1.25) hue-rotate(-12deg) brightness(.97) contrast(1.05)}
  body.th-western #themeFx{display:block;mix-blend-mode:multiply;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(90,50,10,.5) 100%),repeating-linear-gradient(0deg,rgba(120,80,30,.06) 0 2px,rgba(0,0,0,0) 2px 5px)}
  body.th-western #card{background:#ead7ae;color:#3b2412;border:3px double #8a5a2b}
  body.th-western #card #icon svg *, body.th-western #then svg *{stroke:#3b2412}
  body.th-western #card #icon svg [fill="#fff"], body.th-western #then svg [fill="#fff"]{fill:#3b2412}
  body.th-western #then{background:#cdb07c;color:#3b2412}
  body.th-western #dist,body.th-western #verb,body.th-western #street,body.th-western #eta,body.th-western #drawer h2,body.th-western #modalBox h3{font-family:'Rye',serif;font-weight:400}
  body.th-western #speedo{border-color:#8a5a2b;background:#22140a}
  /* Blokkenwereld */
  body.th-blokken{--green:#5b8c32;--green-dark:#3f6b1f;--card:#4f4f4f;--card2:#666;--bg:#383838;--muted:#e0e0e0;--me:#3b82f6}
  body.th-blokken .leaflet-tile{image-rendering:pixelated;image-rendering:crisp-edges}
  body.th-blokken .leaflet-tile-pane{filter:saturate(1.7) contrast(1.15)}
  body.th-blokken #card,body.th-blokken #bar,body.th-blokken #planCard,body.th-blokken #modalBox,body.th-blokken #searchbar,body.th-blokken #sugg,body.th-blokken #then{border-radius:0!important;border:4px solid rgba(0,0,0,.45);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.18)}
  body.th-blokken button{border-radius:0!important}
  body.th-blokken #speedo,body.th-blokken #limitSign{border-radius:0}
  body.th-blokken #dist,body.th-blokken #verb,body.th-blokken #street,body.th-blokken #eta,body.th-blokken #spd,body.th-blokken #drawer h2,body.th-blokken #modalBox h3,body.th-blokken #planInfo b{font-family:'Silkscreen',monospace}
  body.th-blokken #dist{font-size:34px}
  body.th-blokken #eta{font-size:17px}
  body.th-blokken #spd{font-size:28px}
  /* Grote stad */
  body.th-stad{--green:#c21aa0;--green-dark:#2b0f45;--card:#120a1f;--card2:#21123a;--bg:#0a0614;--muted:#b9a6d9;--me:#2fd4ff}
  body.th-stad #map{background:#0a0614}
  body.th-stad .leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.85) contrast(1.2) saturate(1.6)}
  body.th-stad #themeFx{display:block;background:linear-gradient(180deg,rgba(255,40,200,.12),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 72%,rgba(40,200,255,.14))}
  body.th-stad #card{background:linear-gradient(135deg,#1b0b2e,#2b0f45);border:2px solid #ff2fd0;box-shadow:0 0 20px rgba(255,47,208,.45)}
  body.th-stad #dist,body.th-stad #verb,body.th-stad #street,body.th-stad #eta,body.th-stad #drawer h2,body.th-stad #modalBox h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}
  body.th-stad #speedo{border-color:#2fd4ff;box-shadow:0 0 16px rgba(47,212,255,.55);background:#07040e}
  .me{width:34px;height:34px}
  .me svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .dot{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
</style>
</head>
<body>
<div id="map"></div>
<div id="themeFx"></div>

<div id="lock" style="position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#0f1a14,#0b2a1a);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)">
  <h1 style="font-size:32px;margin:0 0 6px">🛵 Brommer Nav</h1>
  <div style="color:var(--muted);font-size:17px;margin-bottom:22px">Deze app is vergrendeld.</div>
  <form id="lockf" autocomplete="on">
    <input id="pw" type="password" placeholder="Code" autocomplete="current-password"
      style="width:100%;font-size:20px;padding:16px;border-radius:14px;border:2px solid #2e4a3a;background:#0b130e;color:#fff;margin-bottom:12px">
    <button id="unlock" type="submit" style="display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:20px;font-weight:800;background:var(--green);color:#fff">Ontgrendelen</button>
  </form>
  <div id="lockerr" style="color:#ffb4b4;font-size:15px;margin-top:10px;display:none">Onjuiste code.</div>
</div>
<div id="app">

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pw, remember){
  let data;
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, key, b(ENC.ct));
    data = JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return false; }
  if(remember){ try{ localStorage.setItem('bn_pw', pw); }catch(e){} }
  document.getElementById('lock').remove();
  document.getElementById('app').innerHTML = data.html;
  const s = document.createElement('script'); s.textContent = data.js; document.body.appendChild(s);
  return true;
}
document.getElementById('lockf').addEventListener('submit', async ev => {
  ev.preventDefault(); const btn = document.getElementById('unlock'); btn.textContent = 'Bezig…';
  const ok = await tryUnlock(document.getElementById('pw').value.trim(), true);
  if(!ok){ btn.textContent = 'Ontgrendelen'; document.getElementById('lockerr').style.display = 'block'; }
});
(async()=>{ let pw=null; try{ pw = localStorage.getItem('bn_pw'); }catch(e){} if(pw){ const ok = await tryUnlock(pw, false); if(!ok){ try{localStorage.removeItem('bn_pw');}catch(e){} } } })();
