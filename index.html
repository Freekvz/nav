<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brommer Nav">
<meta name="theme-color" content="#0f1a14">
<title>Brommer Nav</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --green:#0d7a43; --green-dark:#0a5c33; --bg:#0f1a14; --card:#16231b;
    --text:#ffffff; --muted:#a9bdb0; --warn:#e8a317; --danger:#d93636;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0;z-index:1;background:#dfe6e1}

  /* Instruction card */
  #top{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(var(--st) + 8px) 10px 0}
  #card{background:var(--green);border-radius:18px;display:flex;align-items:center;gap:14px;
    padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #card.off{background:var(--danger)}
  #card.done{background:#1f6fd1}
  #icon{width:68px;height:68px;flex:0 0 68px}
  #icon svg{width:100%;height:100%}
  #dist{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.5px}
  #verb{font-size:20px;font-weight:600;margin-top:4px;opacity:.95}
  #street{font-size:24px;font-weight:800;margin-top:2px;line-height:1.1;word-break:break-word}
  #then{display:none;margin:6px 8px 0;background:var(--green-dark);border-radius:0 0 14px 14px;
    padding:8px 14px;font-size:16px;font-weight:600;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 16px);
    box-shadow:0 4px 12px rgba(0,0,0,.25)}
  #then svg{width:22px;height:22px}
  #road{margin:8px auto 0;width:max-content;max-width:90%;background:rgba(15,26,20,.85);color:#fff;
    padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;display:none}

  /* Bottom bar */
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 10px calc(var(--sb) + 10px)}
  #bar{background:var(--card);border-radius:20px;display:flex;align-items:center;gap:12px;padding:12px 14px;
    box-shadow:0 -4px 20px rgba(0,0,0,.35)}
  #speedo{width:86px;height:86px;flex:0 0 86px;border-radius:50%;border:5px solid #2e4a3a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b130e;transition:border-color .3s}
  #speedo.fast{border-color:var(--danger)}
  #speedo.near{border-color:var(--warn)}
  #spd{font-size:36px;font-weight:800;line-height:1}
  #spdu{font-size:12px;color:var(--muted);font-weight:600}
  #info{flex:1;min-width:0}
  #eta{font-size:26px;font-weight:800}
  #rem{font-size:15px;color:var(--muted);margin-top:2px}
  #btns{display:flex;flex-direction:column;gap:8px}
  .btn{background:#24382c;border:0;color:#fff;border-radius:12px;width:46px;height:40px;font-size:20px;
    display:flex;align-items:center;justify-content:center}
  .btn:active{transform:scale(.95)}
  #recenter{position:absolute;right:14px;z-index:10;display:none;background:#fff;color:#0d7a43;border:0;
    border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.3)}

  /* Start screen */
  #start{position:absolute;inset:0;z-index:50;background:linear-gradient(180deg,#0f1a14,#0b2a1a);
    display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)}
  #start h1{font-size:32px;margin:0 0 6px}
  #start .sub{color:var(--muted);font-size:17px;margin-bottom:22px}
  .route{background:#16231b;border-radius:16px;padding:16px;margin-bottom:22px;font-size:16px;line-height:1.5}
  .route b{color:#7fe0a6}
  .big{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:20px;font-weight:800;margin-bottom:12px}
  #go{background:var(--green);color:#fff}
  #demo{background:#24382c;color:#fff;font-size:17px;padding:14px}
  .note{color:var(--muted);font-size:14px;line-height:1.45;margin-top:8px}
  #err{color:#ffb4b4;font-size:15px;margin-top:10px;display:none}
  .leaflet-control-attribution{font-size:9px!important}
  #me{width:34px;height:34px}
  #me svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
</style>
</head>
<body>
<div id="map"></div>

<div id="top" style="display:none">
  <div id="card">
    <div id="icon"></div>
    <div style="min-width:0">
      <div id="dist">–</div>
      <div id="verb">GPS zoeken…</div>
      <div id="street"></div>
    </div>
  </div>
  <div id="then"></div>
  <div id="road"></div>
</div>

<button id="recenter">◎ Centreren</button>

<div id="bottom" style="display:none">
  <div id="bar">
    <div id="speedo"><div id="spd">0</div><div id="spdu">km/u</div></div>
    <div id="info">
      <div id="eta">--:--</div>
      <div id="rem">– km te gaan</div>
    </div>
    <div id="btns">
      <button class="btn" id="mute" aria-label="Geluid aan/uit">🔊</button>
      <button class="btn" id="stop" aria-label="Stoppen">✕</button>
    </div>
  </div>
</div>

<div id="start">
  <h1>🛵 Brommer Nav</h1>
  <div class="sub">Deze app is vergrendeld.</div>
  <form id="lockf" autocomplete="on">
    <input id="pw" type="password" placeholder="Code" autocomplete="current-password"
      style="width:100%;font-size:20px;padding:16px;border-radius:14px;border:2px solid #2e4a3a;background:#0b130e;color:#fff;margin-bottom:12px">
    <button class="big" id="unlock" type="submit" style="background:var(--green);color:#fff">Ontgrendelen</button>
  </form>
  <div id="lockerr" style="color:#ffb4b4;font-size:15px;display:none">Onjuiste code.</div>

</div>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pw, remember){
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, key, b(ENC.ct));
    const data = JSON.parse(new TextDecoder().decode(pt));
    if(remember){ try{ localStorage.setItem('bn_pw', pw); }catch(e){} }
    document.getElementById('start').innerHTML = data.html;
    const s = document.createElement('script'); s.textContent = data.js; document.body.appendChild(s);
    return true;
  }catch(e){ return false; }
}
document.getElementById('lockf').addEventListener('submit', async ev => {
  ev.preventDefault(); const btn = document.getElementById('unlock'); btn.textContent = 'Bezig…';
  const ok = await tryUnlock(document.getElementById('pw').value.trim(), true);
  if(!ok){ btn.textContent = 'Ontgrendelen'; document.getElementById('lockerr').style.display = 'block'; }
});
(async()=>{ let pw=null; try{ pw = localStorage.getItem('bn_pw'); }catch(e){} if(pw){ const ok = await tryUnlock(pw, false); if(!ok){ try{localStorage.removeItem('bn_pw');}catch(e){} } } })();
